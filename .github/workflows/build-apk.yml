name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stahnout kod
        uses: actions/checkout@v4

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Nainstalovat Capacitor a pridat Android
        run: |
          npm install
          mkdir -p www
          cp index.html www/
          [ -f sw.js ] && cp sw.js www/ || true
          npx cap add android
          npx cap sync android

      - name: Pridat opravneni kamery a polohy
        run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, "r", encoding="utf-8").read()
          add = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />"""
          if "android.permission.CAMERA" not in s:
              s = s.replace("<uses-permission", add + "\n    <uses-permission", 1)
              open(p, "w", encoding="utf-8").write(s)
          '

      - name: Nastavit Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sestavit APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Ulozit APK ke stazeni
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
